<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura della Sardegna - Mostra Multimediale & Audioguida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* CSS RESET & VARIABILI IDENTITARIE */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-cream: #fdfbf7;
            --bg-stone: #f5f0e6;
            --bg-card: #ffffff;
            --accent-blue: #0c3c5e;
            --accent-blue-light: #165685;
            --accent-myrtle: #1e4631;
            --accent-myrtle-light: #2c6648;
            --text-dark: #2c2927;
            --text-muted: #6e6762;
            --border-color: #dcd4c4;
            --font-title: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --shadow-sm: 0 4px 12px rgba(44, 41, 39, 0.04);
            --shadow-md: 0 12px 24px rgba(44, 41, 39, 0.08);
            --transition: all 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        body {
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* TIPOGRAFIA EDITORIALE */
        h1, h2, h3, h4 {
            font-family: var(--font-title);
            font-weight: 600;
            color: var(--accent-blue);
        }

        p {
            font-size: 10.5pt;
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        /* HEADER & MENU NAVIGAZIONE */
        header {
            background-color: rgba(253, 251, 247, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--accent-myrtle);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: var(--font-title);
            font-weight: bold;
            font-size: 14pt;
        }

        .logo-text {
            font-family: var(--font-title);
            font-size: 14pt;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-blue);
        }

        .nav-menu {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 9.5pt;
            font-weight: 500;
            transition: var(--transition);
            padding: 0.5rem 0;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-myrtle);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-myrtle);
        }

        /* HERO / INTRODUZIONE DELLA MOSTRA */
        .hero {
            padding: 5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 28pt;
            margin-bottom: 1.5rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-family: var(--font-title);
            font-size: 13pt;
            font-style: italic;
            color: var(--accent-myrtle);
            margin-bottom: 3.5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .quotes-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
            margin-top: 2rem;
        }

        @media (min-width: 768px) {
            .quotes-container {
                grid-template-columns: 1fr 1fr;
                gap: 3rem;
            }
        }

        .quote-card {
            background-color: var(--bg-stone);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: relative;
            text-align: left;
            box-shadow: var(--shadow-sm);
        }

        .quote-card::before {
            content: "“";
            font-family: var(--font-title);
            font-size: 60pt;
            color: rgba(30, 70, 49, 0.1);
            position: absolute;
            top: -10px;
            left: 20px;
            line-height: 1;
        }

        .quote-text {
            font-family: var(--font-title);
            font-size: 12pt;
            font-style: italic;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
        }

        .quote-author {
            font-size: 9.5pt;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quote-author::before {
            content: "";
            display: inline-block;
            width: 20px;
            height: 1px;
            background-color: var(--accent-blue);
        }

        /* LAYOUT PERCORSO ESPOSITIVO FLOATING CARDS */
        .exhibition-container {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            position: relative;
        }
